name: Windows MuMu Player ADB via frp

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FRP_SERVER: 187372.xyz
  FRP_TOKEN: wobushijiahao
  FRP_REMOTE_PORT: 5555

jobs:
  mumu-adb-frp:
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: Checkout (for helper scripts)
        uses: actions/checkout@v4

      # --------------------------------------------------------------------
      # 1) Download MuMuPlayer (international) official online installer
      # --------------------------------------------------------------------
      - name: Download MuMuPlayer (International)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force C:\mumu | Out-Null
          # Official international download API (signed redirect to a11.gdl.netease.com)
          Invoke-WebRequest "https://api.mumuplayer.com/api/dl/win?channel=gw-win-download" `
            -OutFile C:\mumu\MuMuSetup.exe -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" `
            -MaximumRedirection 10
          $f = Get-Item C:\mumu\MuMuSetup.exe
          Write-Host "Downloaded: $($f.FullName) ($([math]::Round($f.Length/1MB,2)) MB)"
          if ($f.Length -lt 1MB) { throw "Installer too small ($($f.Length) bytes)" }

      # --------------------------------------------------------------------
      # 2) Run the installer inside the CONSOLE session (its UI is invisible
      #    from the agent session) and click "Install now" there.
      #    Driver: .github/scripts/mumu_ui_click.ps1
      # --------------------------------------------------------------------
      - name: Launch installer UI in console session & click Install now
        shell: pwsh
        run: |
          $driver = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\mumu_ui_click.ps1'
          $a = New-ScheduledTaskAction -Execute 'powershell.exe' `
                 -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$driver`"" `
                 -WorkingDirectory 'C:\mumu'
          $p = New-ScheduledTaskPrincipal -UserId 'runneradmin' -LogonType Interactive -RunLevel Highest
          Register-ScheduledTask -TaskName 'MuMuUiClick' -Action $a -Principal $p -Force | Out-Null
          Start-ScheduledTask -TaskName 'MuMuUiClick'

          # wait for the click (or absence of the dialog)
          $deadline = (Get-Date).AddMinutes(12)
          do {
            Start-Sleep -Seconds 10
            $s = (Get-Content C:\mumu\ui_status.txt -ErrorAction SilentlyContinue)
            Write-Host "[ui] $s"
          } while ($s -notin @('clicked', 'no_window') -and (Get-Date) -lt $deadline)
          if ($s -eq 'no_window') {
            Write-Host "::warning::installer dialog not found - maybe it auto-installed; continuing"
          }
          if ($s -ne 'clicked' -and $s -ne 'no_window') { throw "installer UI click failed (status=$s)" }

      # --------------------------------------------------------------------
      # 3) Wait for the (silent, automatic) installation to finish
      # --------------------------------------------------------------------
      - name: Wait for MuMuPlayer installation to complete
        shell: pwsh
        run: |
          # NOTE: nx_main\MuMuManager.exe appears EARLY (first small component).
          # Install is "done" when the manager exists AND every installer process
          # (stub, downloader, aria2, component installers) has exited.
          # Instance creation (if any) is handled by the next step.
          $deadline = (Get-Date).AddMinutes(35)
          $mm = $null; $loc = $null
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 15
            $reg = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
                   Where-Object { $_.DisplayName -match '^MuMuPlayer' -and $_.InstallLocation } |
                   Select-Object -First 1
            if (-not $reg) { Write-Host "[install] waiting for registry key..."; continue }
            $loc = $reg.InstallLocation.Trim('"')
            $cand = Join-Path $loc 'nx_main\MuMuManager.exe'
            if (-not (Test-Path $cand)) { Write-Host "[install] registry ok, nx_main not yet installed"; continue }
            $busy = (Get-Process | Where-Object { $_.Name -match '^(MuMuSetup|nemu-downloader|aria2|MuMu-setup)' } | Measure-Object).Count
            Write-Host ("[install] manager=yes installer_procs={0}" -f $busy)
            if ($busy -eq 0) { $mm = $cand; break }
          }
          if (-not $mm) {
            Write-Host "::error::installation did not complete; diagnostics:"
            if ($mm -eq $null -and $loc) {
              Get-ChildItem $loc -Directory -Recurse -Depth 2 -ErrorAction SilentlyContinue |
                Select-Object -First 40 -ExpandProperty FullName | Write-Host
              & (Join-Path $loc 'nx_main\MuMuManager.exe') info -v all 2>&1 | Write-Host
            }
            Get-ChildItem "$env:LOCALAPPDATA\Temp" -Filter 'nemux-downloader-*.log' -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime | Select-Object -Last 1 |
              ForEach-Object { Get-Content $_.FullName -Tail 30 | Write-Host }
            throw "MuMuPlayer installation did not complete in time"
          }
          Write-Host "============================================"
          Write-Host " MuMuPlayer installed at: $loc"
          Write-Host "============================================"
          Write-Host "MuMuManager: $mm"
          "MUMU_MANAGER=$mm"   | Out-File -FilePath $env:GITHUB_ENV -Append
          "MUMU_LOCATION=$loc" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $mm info -v all 2>&1 | Write-Host

      # --------------------------------------------------------------------
      # 4) Enable root (patch instance configs) & (re)launch the emulator
      # --------------------------------------------------------------------
      - name: Enable root & launch emulator
        shell: pwsh
        run: |
          $mm  = $env:MUMU_MANAGER
          $loc = $env:MUMU_LOCATION

          # engine sanity check: the Android ROM component must be installed
          $engine = Get-ChildItem $loc -Directory -Filter 'nx_device' -Recurse -Depth 2 -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          if (-not $engine) {
            Write-Host "::error::engine component (nx_device) missing - ROM install failed"
            Get-ChildItem $loc -Directory | Select-Object -ExpandProperty FullName | Write-Host
            throw "engine component missing"
          }
          Write-Host "== engine found: $($engine.FullName)"

          # stop the player so config files can be patched safely
          Write-Host "== shutting down player (best effort)"
          & $mm control -v all shutdown 2>&1 | Write-Host
          Start-Sleep -Seconds 15

          Write-Host "== patching root permission in instance configs"
          $cfgs = @(Get-ChildItem "$loc\vms" -Recurse -Depth 3 -Filter 'customer_config.json' -ErrorAction SilentlyContinue) +
                  (Get-ChildItem "$loc\nx_device" -Recurse -Depth 5 -Filter 'customer_config.json' -ErrorAction SilentlyContinue)
          $cfgs = $cfgs | Select-Object -Unique -ExpandProperty FullName
          if (-not $cfgs) { Write-Host "::warning::no customer_config.json found - root stays at default (adbd is root anyway)" }
          foreach ($cf in $cfgs) {
            try {
              Write-Host "== patching $cf"
              $j = Get-Content $cf -Raw -Encoding UTF8 | ConvertFrom-Json
              if (-not $j.setting) { $j | Add-Member -NotePropertyName setting -NotePropertyValue ([pscustomobject]@{}) }
              if (-not $j.setting.other_setting) { $j.setting | Add-Member -NotePropertyName other_setting -NotePropertyValue ([pscustomobject]@{}) }
              if ($j.setting.other_setting.PSObject.Properties['root_mode']) { $j.setting.other_setting.root_mode = '1' }
              else { $j.setting.other_setting | Add-Member -NotePropertyName root_mode -NotePropertyValue '1' }
              if (-not $j.setting.disk_share) { $j.setting | Add-Member -NotePropertyName disk_share -NotePropertyValue ([pscustomobject]@{}) }
              if (-not $j.setting.disk_share.mode) { $j.setting.disk_share | Add-Member -NotePropertyName mode -NotePropertyValue ([pscustomobject]@{}) }
              if ($j.setting.disk_share.mode.PSObject.Properties['choose']) { $j.setting.disk_share.mode.choose = 'disk_share.mode.writable' }
              else { $j.setting.disk_share.mode | Add-Member -NotePropertyName choose -NotePropertyValue 'disk_share.mode.writable' }
              $j | ConvertTo-Json -Depth 64 | Set-Content $cf -Encoding UTF8
              $vf = Join-Path (Split-Path $cf) 'vm_config.json'
              if (Test-Path $vf) {
                $v = Get-Content $vf -Raw -Encoding UTF8 | ConvertFrom-Json
                if ($v.system_vdi -and $v.system_vdi.PSObject.Properties['sharable']) { $v.system_vdi.sharable = 'Writable' }
                elseif ($v.vm -and $v.vm.system_vdi -and $v.vm.system_vdi.PSObject.Properties['sharable']) { $v.vm.system_vdi.sharable = 'Writable' }
                else {
                  if (-not $v.system_vdi) { $v | Add-Member -NotePropertyName system_vdi -NotePropertyValue ([pscustomobject]@{}) }
                  $v.system_vdi | Add-Member -NotePropertyName sharable -NotePropertyValue 'Writable'
                }
                $v | ConvertTo-Json -Depth 64 | Set-Content $vf -Encoding UTF8
              }
            } catch { Write-Host "::warning::patch failed for ${cf}: $_" }
          }

          Write-Host "== launching emulator (instance 0)"
          & $mm control -v 0 launch 2>&1 | Write-Host
          Start-Sleep -Seconds 5
          $probe = (& $mm info -v 0 2>&1 | Out-String)
          if ($probe -notmatch '"index"') {
            Write-Host "== instance 0 missing, creating it"
            & $mm create -v 0 2>&1 | Write-Host
            Start-Sleep -Seconds 5
            & $mm control -v 0 launch 2>&1 | Write-Host
          }
          # wait until the instance is registered and its process started
          $deadline = (Get-Date).AddMinutes(6)
          $started = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
            $probe = (& $mm info -v 0 2>&1 | Out-String)
            Write-Host ("[launch] process_started={0}" -f ($probe -match '"is_process_started"\s*:\s*true'))
            if ($probe -match '"is_process_started"\s*:\s*true') { $started = $true; break }
          }
          & $mm info -v 0 2>&1 | Write-Host
          if (-not $started) { throw "emulator instance 0 did not start (see info above)" }

      # --------------------------------------------------------------------
      # 5) Install platform-tools and wait until adb on 127.0.0.1:5555 is up
      #    (MuMu international exposes adbd on 5555; it answers mid-boot)
      # --------------------------------------------------------------------
      - name: Wait for ADB on 127.0.0.1:5555
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile C:\mumu\plt.zip
          Expand-Archive C:\mumu\plt.zip -DestinationPath C:\mumu\plt
          $env:Path = "C:\mumu\plt\platform-tools;$env:Path"
          "PLT_DIR=C:\mumu\plt\platform-tools" | Out-File -FilePath $env:GITHUB_ENV -Append
          adb version

          $deadline = (Get-Date).AddMinutes(50)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 15
            $lis = (netstat -ano | Select-String '127\.0\.0\.1:5555\s.*LISTENING' | Measure-Object).Count
            if ($lis -eq 0) { Write-Host "[adb] 5555 not listening yet"; continue }
            adb start-server 2>$null
            adb connect 127.0.0.1:5555 | Write-Host
            $d = adb devices | Out-String
            Write-Host $d
            if ($d -match '127\.0\.0\.1:5555\s+device' -or $d -match 'emulator-5554\s+device') { $ok = $true; break }
          }
          if (-not $ok) { throw "adb device on 5555 did not come up in time" }
          Write-Host "ADB is up on 127.0.0.1:5555"

      # --------------------------------------------------------------------
      # 6) Make sure adbd runs as root (warm-up; final check comes last)
      # --------------------------------------------------------------------
      - name: Enable root over adb (adb root)
        shell: pwsh
        run: |
          $env:Path = "$env:PLT_DIR;$env:Path"
          foreach ($i in 1..5) {
            adb connect 127.0.0.1:5555 2>$null | Out-Null
            $r = adb -s 127.0.0.1:5555 root 2>&1 | Out-String
            Write-Host "adb root => $($r.Trim())"
            if ($r -match 'root') { break }
            Start-Sleep -Seconds 10
          }
          Start-Sleep -Seconds 5
          adb connect 127.0.0.1:5555 | Write-Host
          $id = adb -s 127.0.0.1:5555 shell id 2>&1 | Out-String
          Write-Host "id (via -s) => $($id.Trim())"
          adb -s 127.0.0.1:5555 shell getprop ro.build.version.release
          adb -s 127.0.0.1:5555 shell getprop ro.product.model

      # --------------------------------------------------------------------
      # 7) Start frpc: 127.0.0.1:5555 -> 187372.xyz:5555
      # --------------------------------------------------------------------
      - name: Start frpc (port5555)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Set-Location C:\mumu
          Invoke-WebRequest https://github.com/fatedier/frp/releases/download/v0.61.1/frp_0.61.1_windows_amd64.zip -OutFile C:\mumu\frp.zip
          Expand-Archive C:\mumu\frp.zip -DestinationPath C:\mumu\frpdir
          Copy-Item (Get-ChildItem C:\mumu\frpdir -Recurse -Filter frpc.exe | Select-Object -First 1 -ExpandProperty FullName) C:\mumu\frpc.exe -Force
          Get-Item C:\mumu\frpc.exe | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host

          Write-Host "Launching: .\frpc.exe tcp --server_addr=$env:FRP_SERVER --server_port=7000 --token=*** --proxy_name=port5555 --local_ip=127.0.0.1 --local_port=5555 --remote_port=$env:FRP_REMOTE_PORT"
          $p = Start-Process C:\mumu\frpc.exe -ArgumentList @(
            'tcp',
            "--server_addr=$env:FRP_SERVER",
            '--server_port=7000',
            "--token=$env:FRP_TOKEN",
            '--proxy_name=port5555',
            '--local_ip=127.0.0.1',
            '--local_port=5555',
            "--remote_port=$env:FRP_REMOTE_PORT"
          ) -PassThru -WindowStyle Hidden -RedirectStandardOutput C:\mumu\frpc.log -RedirectStandardError C:\mumu\frpc.err.log
          Start-Sleep -Seconds 10
          Get-Content C:\mumu\frpc.log     | Write-Host
          Get-Content C:\mumu\frpc.err.log | Write-Host
          if ($p.HasExited) { throw "frpc exited immediately (code $($p.ExitCode))" }
          if (-not (Get-Content C:\mumu\frpc.log | Select-String 'start proxy success')) {
            throw "frpc did not report 'start proxy success'"
          }
          "FRPC_PID=$($p.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "============================================"
          Write-Host "  frp tunnel up: adb connect $env:FRP_SERVER`:$env:FRP_REMOTE_PORT"
          Write-Host "============================================"

      # --------------------------------------------------------------------
      # 8) REQUIRED FINAL VERIFICATION: adb root && adb shell id
      # --------------------------------------------------------------------
      - name: FINAL VERIFICATION (adb root && adb shell id)
        shell: pwsh
        run: |
          $env:Path = "$env:PLT_DIR;$env:Path"
          adb kill-server 2>$null
          adb start-server 2>$null
          adb connect 127.0.0.1:5555 | Write-Host
          Start-Sleep -Seconds 2
          # dedupe transports: MuMu's adbd also auto-registers as emulator-5554
          adb disconnect 127.0.0.1:5555 | Write-Host
          Start-Sleep -Seconds 2
          $dev = adb devices | Out-String
          Write-Host $dev
          if ($dev -match 'emulator-5554\s+device') { $env:ANDROID_SERIAL = 'emulator-5554' }
          else {
            Write-Host "emulator transport absent, falling back to tcp serial"
            adb connect 127.0.0.1:5555 | Write-Host
            $env:ANDROID_SERIAL = '127.0.0.1:5555'
          }

          $final = ''
          foreach ($i in 1..3) {
            Write-Host "============================================================"
            Write-Host "  REQUIRED FINAL VERIFICATION: adb root && adb shell id"
            Write-Host "============================================================"
            $final = (adb root && adb shell id) 2>&1 | Out-String
            Write-Host $final.Trim()
            if ($final -match 'uid=0\(root\)') { break }
            Write-Host "attempt $i failed, reconnecting and retrying..."
            adb kill-server 2>$null; adb start-server 2>$null
            adb connect 127.0.0.1:5555 | Out-Null
            Start-Sleep -Seconds 5
          }
          if ($final -notmatch 'uid=0\(root\)') { throw "FINAL VERIFICATION FAILED - no uid=0(root)" }
          Write-Host "============================================================"
          Write-Host "  VERIFIED: root (uid=0) + adb available on 5555"
          Write-Host "  external: adb connect $env:FRP_SERVER`:$env:FRP_REMOTE_PORT"
          Write-Host "============================================================"

      # --------------------------------------------------------------------
      # 9) Keep alive (frp tunnel + emulator stay up for the job window)
      # --------------------------------------------------------------------
      - name: Keep alive
        shell: pwsh
        run: |
          $env:Path = "$env:PLT_DIR;$env:Path"
          $cli = @('tcp', "--server_addr=$env:FRP_SERVER", '--server_port=7000', "--token=$env:FRP_TOKEN",
                   '--proxy_name=port5555', '--local_ip=127.0.0.1', '--local_port=5555',
                   "--remote_port=$env:FRP_REMOTE_PORT")
          while ($true) {
            Start-Sleep -Seconds 300
            $frpc = (Get-Process frpc -ErrorAction SilentlyContinue | Measure-Object).Count
            if ($frpc -eq 0) {
              Write-Host "[heartbeat] frpc died - restarting"
              Start-Process C:\mumu\frpc.exe -ArgumentList $cli -WindowStyle Hidden `
                -RedirectStandardOutput C:\mumu\frpc.log -RedirectStandardError C:\mumu\frpc.err.log
            }
            adb connect 127.0.0.1:5555 2>$null | Out-Null
            $d = (adb devices | Out-String).Trim() -replace "`r", ''
            Write-Host "[heartbeat] frpc_procs=$frpc; $d"
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Get-Process frpc -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($env:MUMU_MANAGER) { & $env:MUMU_MANAGER control -v all shutdown 2>&1 }

      - name: Upload debug artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mumu-debug
          path: |
            C:\mumu\ui_*.png
            C:\mumu\ui_status.txt
            C:\mumu\frpc.log
          if-no-files-found: ignore
