name: Windows RDP via frp

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RDP_USER: runneradmin
  RDP_PASS: P@ssw0rd!2024
  FRP_SERVER: 187372.xyz
  FRP_TOKEN: wobushijiahao
  FRP_REMOTE_PORT: 6000

jobs:
  frp-rdp:
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: Enable RDP on Windows Runner
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Set-LocalUser -Name $env:RDP_USER -Password (ConvertTo-SecureString "$env:RDP_PASS" -AsPlainText -Force)
          Set-Service -Name "W32Time" -StartupType Automatic -ErrorAction SilentlyContinue
          Restart-Service W32Time -ErrorAction SilentlyContinue
          w32tm /resync /force | Out-Null

      - name: Download frp
        run: |
          Invoke-WebRequest https://github.com/fatedier/frp/releases/download/v0.61.1/frp_0.61.1_windows_amd64.zip -OutFile frp.zip
          Expand-Archive frp.zip -DestinationPath .
          $frpDir = (Get-ChildItem -Directory -Filter "frp_0.61.1_windows_amd64" | Select-Object -First 1).FullName
          Write-Host "FRP_DIR=$frpDir"
          "FRP_DIR=$frpDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create frpc.toml
        run: |
          $frpcConfig = "serverAddr = `"$env:FRP_SERVER`"`nserverPort = 7000`nauth.token = `"$env:FRP_TOKEN`"`nlog.level = `"warn`"`n`n[[proxies]]`nname = `"rdp`"`ntype = `"tcp`"`nlocalIP = `"127.0.0.1`"`nlocalPort = 3389`nremotePort = $env:FRP_REMOTE_PORT"
          Set-Content -Path "$env:FRP_DIR\frpc.toml" -Value $frpcConfig -Encoding UTF8
          Get-Content "$env:FRP_DIR\frpc.toml"

      - name: Start frpc & Keep Alive
        run: |
          Set-Location $env:FRP_DIR
          Write-Host "============================================"
          Write-Host "  RDP Connection Details (frp)"
          Write-Host "============================================"
          Write-Host "Server      : $env:FRP_SERVER:$env:FRP_REMOTE_PORT"
          Write-Host "Username    : $env:RDP_USER"
          Write-Host "Password    : $env:RDP_PASS"
          Write-Host "============================================"
          Write-Host "客户端连接：mstsc 连接 $env:FRP_SERVER:$env:FRP_REMOTE_PORT"
          Write-Host "frpc is running. Keeping workflow alive..."
          & .\frpc.exe -c .\frpc.toml
          exit $LASTEXITCODE

      - name: Cleanup
        if: always()
        run: Get-Process frpc -ErrorAction SilentlyContinue | Stop-Process -Force
