name: Windows MuMu Player ADB via frp

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FRP_SERVER: 187372.xyz
  FRP_TOKEN: wobushijiahao
  FRP_REMOTE_PORT: 5555
  MUMU_ADB_PORT: 5555

jobs:
  mumu-adb-frp:
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: Download MuMuPlayer (International)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $setup = "$env:RUNNER_TEMP\MuMuSetup.exe"
          # Official international download API (follows signed redirect to a11.gdl.netease.com)
          Invoke-WebRequest "https://api.mumuplayer.com/api/dl/win?channel=gw-win-download" -OutFile $setup `
            -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -MaximumRedirection 10
          $f = Get-Item $setup
          Write-Host "Downloaded: $($f.FullName) ($([math]::Round($f.Length/1MB,2)) MB)"
          if ($f.Length -lt 1MB) { throw "Installer looks too small ($($f.Length) bytes)" }
          "MUMU_SETUP=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install MuMuPlayer silently
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $setup = $env:MUMU_SETUP

          function Find-MuMuRoot {
            # 1) registry uninstall entries
            $roots = @()
            foreach ($hive in 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
                               'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall') {
              Get-ChildItem $hive -ErrorAction SilentlyContinue | ForEach-Object {
                $p = Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue
                if ($p.DisplayName -match 'MuMu' ) {
                  foreach ($cand in @($p.InstallLocation, $p.DisplayIcon)) {
                    if ($cand) {
                      $dir = if (Test-Path $cand -PathType Leaf) { Split-Path $cand } else { $cand }
                      while ($dir -and -not (Test-Path (Join-Path $dir 'shell'))) { $dir = Split-Path $dir }
                      if ($dir) { $roots += $dir }
                    }
                  }
                }
              }
            }
            # 2) well-known folders
            foreach ($base in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              Get-ChildItem (Join-Path $base 'Netease') -Directory -ErrorAction SilentlyContinue |
                Where-Object Name -match 'MuMu|Nemu' | ForEach-Object { $roots += $_.FullName }
            }
            foreach ($r in ($roots | Select-Object -Unique)) {
              if (Test-Path (Join-Path $r 'shell\MuMuManager.exe')) { return $r }
            }
            return $null
          }

          # Try NSIS-style silent switch first
          Write-Host "== Attempt 1: MuMuSetup.exe /S"
          Start-Process $setup -ArgumentList '/S' -WorkingDirectory $env:RUNNER_TEMP
          $deadline = (Get-Date).AddMinutes(4)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 15
            $r = Find-MuMuRoot
            if ($r) { break }
          }
          $root = Find-MuMuRoot
          if (-not $root) {
            Write-Host "== '/S' produced nothing; killing installer and launching downloader UI (auto-downloads & installs)"
            Get-Process | Where-Object { $_.Path -eq $setup } -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 3
            Start-Process $setup -WorkingDirectory $env:RUNNER_TEMP
          }
          # Wait for installation to finish (downloader pulls the full engine package)
          $deadline = (Get-Date).AddMinutes(45)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 20
            $root = Find-MuMuRoot
            if ($root) { break }
          }
          if (-not $root) {
            Write-Host "::error::MuMuPlayer installation was not detected within timeout"
            Get-ChildItem "$env:ProgramFiles\Netease" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }
          Write-Host "============================================"
          Write-Host " MuMu installed at: $root"
          Write-Host "============================================"
          Get-ChildItem $root | Select-Object Name | Format-Table -AutoSize | Out-String | Write-Host
          "MUMU_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Launch emulator (first boot)
        shell: pwsh
        run: |
          $manager = Join-Path $env:MUMU_ROOT 'shell\MuMuManager.exe'
          "MUMU_MANAGER=$manager" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "== Instance overview before launch"
          & $manager info -v all 2>&1 | Write-Host

          # make sure instance 0 exists (fresh installs usually have it; create if missing)
          $probe = (& $manager info -v 0 2>&1 | Out-String)
          if ($probe -notmatch '"index"' -and $probe -notmatch 'is_main') {
            Write-Host "== Instance 0 missing, creating..."
            & $manager create -v 0 2>&1 | Write-Host
          }

          Write-Host "== Launching instance 0"
          & $manager control -v 0 launch 2>&1 | Write-Host

          $deadline = (Get-Date).AddMinutes(25)
          $started = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
            $raw = (& $manager info -v 0 2>&1 | Out-String)
            if ($raw -match '"launch_err_code"\s*:\s*(-?\d+)' -and $matches[1] -ne '0') {
              Write-Host "::warning::launch_err_code=$($matches[1])"
            }
            if ($raw -match '"is_android_started"\s*:\s*true') { $started = $true; break }
            if ((Get-Date) -gt $deadline.AddSeconds(-5)) { Write-Host $raw }
          }
          Write-Host "== Final state after first boot:"
          & $manager info -v 0 2>&1 | Write-Host
          if (-not $started) { throw "Android did not finish booting on first launch (check vt_enabled/hyperv above)" }
          Write-Host "First boot OK"

      - name: Enable root (patch instance configs)
        shell: pwsh
        run: |
          $manager = $env:MUMU_MANAGER
          $root    = $env:MUMU_ROOT

          Write-Host "== Shutting down instance 0 so configs can be patched"
          & $manager control -v 0 shutdown 2>&1 | Write-Host
          Start-Sleep -Seconds 20

          Write-Host "== Available MuMuManager setting keys (for reference/debug):"
          & $manager setting -v 0 keys 2>&1 | Write-Host

          # locate per-instance config dirs (<root>\vms\*, <root>\nx_device\*\vms\*)
          $searchBases = @(Join-Path $root 'vms'), (Join-Path $root 'nx_device')
          $cfgFiles = @()
          foreach ($b in $searchBases) {
            if (Test-Path $b) {
              $cfgFiles += Get-ChildItem $b -Recurse -Depth 6 -Include customer_config.json -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            }
          }
          if (-not $cfgFiles) { $cfgFiles = Get-ChildItem $root -Recurse -Depth 8 -Include customer_config.json -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName }
          if (-not $cfgFiles) { throw "No customer_config.json found under $root" }

          function Add-Node($obj, [string]$name) {
            if (-not ($obj.PSObject.Properties[$name])) {
              $obj | Add-Member -NotePropertyName $name -NotePropertyValue ([pscustomobject]@{})
            }
            return $obj.$name
          }

          foreach ($cf in $cfgFiles) {
            Write-Host "== Patching $cf"
            $j = Get-Content $cf -Raw -Encoding UTF8 | ConvertFrom-Json
            $setting = Add-Node $j 'setting'
            $other   = Add-Node $setting 'other_setting'
            # Root permission ON
            if ($other.PSObject.Properties['root_mode']) { $other.root_mode = '1' }
            else { $other | Add-Member -NotePropertyName root_mode -NotePropertyValue '1' }
            # Writable system disk
            $disk = Add-Node $setting 'disk_share'
            $mode = Add-Node $disk 'mode'
            if ($mode.PSObject.Properties['choose']) { $mode.choose = 'disk_share.mode.writable' }
            else { $mode | Add-Member -NotePropertyName choose -NotePropertyValue 'disk_share.mode.writable' }
            $j | ConvertTo-Json -Depth 64 | Set-Content $cf -Encoding UTF8

            $vf = Join-Path (Split-Path $cf) 'vm_config.json'
            if (Test-Path $vf) {
              $v = Get-Content $vf -Raw -Encoding UTF8 | ConvertFrom-Json
              if     ($v.system_vdi -and $v.system_vdi.PSObject.Properties['sharable'])   { $v.system_vdi.sharable = 'Writable' }
              elseif ($v.vm -and $v.vm.system_vdi -and $v.vm.system_vdi.PSObject.Properties['sharable']) { $v.vm.system_vdi.sharable = 'Writable' }
              else {
                $svd = Add-Node $v 'system_vdi'
                $svd | Add-Member -NotePropertyName sharable -NotePropertyValue 'Writable'
              }
              $v | ConvertTo-Json -Depth 64 | Set-Content $vf -Encoding UTF8
              Write-Host "== Patched $vf"
            }
          }

          Write-Host "== Relaunching instance 0 with root enabled"
          & $manager control -v 0 launch 2>&1 | Write-Host
          $deadline = (Get-Date).AddMinutes(25); $started = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
            $raw = (& $manager info -v 0 2>&1 | Out-String)
            if ($raw -match '"is_android_started"\s*:\s*true') { $started = $true; break }
          }
          if (-not $started) { throw "Android did not come back after enabling root" }
          $raw = (& $manager info -v 0 2>&1 | Out-String)
          Write-Host $raw
          if ($raw -match '"adb_host_ip"\s*:\s*"([^"]+)"') { $ip = $matches[1] } else { $ip = '127.0.0.1' }
          if ($raw -match '"adb_port"\s*:\s*(\d+)')        { $port = [int]$matches[1] } else { $port = 5555 }
          Write-Host "ADB endpoint reported by MuMuManager: ${ip}:${port}"
          "MUMU_ADB_IP=$ip"  | Out-File -FilePath $env:GITHUB_ENV -Append
          "MUMU_ADB_PORT_DETECTED=$port" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup adb and expose it on port 5555
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile plt.zip
          Expand-Archive plt.zip -DestinationPath plt
          $plt = "$PWD\plt\platform-tools"
          $env:Path = "$plt;$env:Path"
          "PLT_DIR=$plt" | Out-File -FilePath $env:GITHUB_ENV -Append
          adb version

          $srcPort = [int]$env:MUMU_ADB_PORT_DETECTED
          adb kill-server; adb start-server
          adb connect "127.0.0.1:$srcPort"
          adb devices

          # Make sure ADB is reachable on 127.0.0.1:5555 (what frpc forwards)
          if ($srcPort -ne 5555) {
            Write-Host "== MuMu bridge is on $srcPort; adding portproxy 5555 -> $srcPort"
            New-NetFirewallRule -DisplayName 'Allow MuMu ADB 5555' -Direction Inbound -LocalPort 5555 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue | Out-Null
            netsh interface portproxy add v4tov4 listenaddress=127.0.0.1 listenport=5555 connectaddress=127.0.0.1 connectport=$srcPort
            netsh interface portproxy show all
          } else {
            Write-Host "== MuMu bridge already listens on 5555, no proxy needed"
          }
          Test-NetConnection 127.0.0.1 -Port 5555 | Format-List TcpTestSucceeded

      - name: Start frpc (5555 -> 187372.xyz:5555)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest https://github.com/fatedier/frp/releases/download/v0.61.1/frp_0.61.1_windows_amd64.zip -OutFile frp.zip
          Expand-Archive frp.zip -DestinationPath .
          $frpDir = (Get-ChildItem -Directory -Filter "frp_0.61.1_windows_amd64" | Select-Object -First 1).FullName
          "FRP_DIR=$frpDir" | Out-File -FilePath $env:GITHUB_ENV -Append

          Set-Location $frpDir
          $log = "$frpDir\frpc.log"
          $args = @(
            'tcp',
            "--server_addr=$env:FRP_SERVER",
            '--server_port=7000',
            "--token=$env:FRP_TOKEN",
            '--proxy_name=port5555',
            '--local_ip=127.0.0.1',
            '--local_port=5555',
            "--remote_port=$env:FRP_REMOTE_PORT"
          )
          Write-Host "Launching: .\frpc.exe $($args -join ' ')"
          $p = Start-Process -FilePath '.\frpc.exe' -ArgumentList $args -PassThru -WindowStyle Hidden -RedirectStandardOutput $log -RedirectStandardError "$frpDir\frpc.err.log"
          Start-Sleep -Seconds 8
          Get-Content $log -ErrorAction SilentlyContinue | Write-Host
          Get-Content "$frpDir\frpc.err.log" -ErrorAction SilentlyContinue | Write-Host
          if ($p.HasExited) { throw "frpc exited immediately with code $($p.ExitCode)" }
          "FRPC_PID=$($p.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "============================================"
          Write-Host "  ADB over frp is up"
          Write-Host "============================================"
          Write-Host "Server : $env:FRP_SERVER:$env:FRP_REMOTE_PORT"
          Write-Host "Connect: adb connect $env:FRP_SERVER`:$env:FRP_REMOTE_PORT"
          Write-Host "============================================"

      - name: Verify root & adb (adb root && adb shell id)
        shell: pwsh
        run: |
          $env:Path = "$env:PLT_DIR;$env:Path"
          adb kill-server; adb start-server
          adb connect 127.0.0.1:5555
          adb devices

          # drop any duplicate transport so plain `adb` targets the 5555 device
          $det = [int]$env:MUMU_ADB_PORT_DETECTED
          if ($det -ne 5555) { adb disconnect "127.0.0.1:$det" }

          Write-Host "== REQUIRED FINAL VERIFICATION: adb root && adb shell id"
          adb root
          Start-Sleep -Seconds 3
          adb connect 127.0.0.1:5555 | Out-Null
          $id = adb shell id
          Write-Host "adb shell id => $id"
          if ($id -notmatch 'uid=0\(root\)') { throw "Root verification FAILED: '$id'" }
          Write-Host "============================================"
          Write-Host "  VERIFIED: uid=0(root) via adb on 127.0.0.1:5555"
          Write-Host "============================================"
          adb shell getprop ro.build.version.release
          adb shell getprop ro.product.model

      - name: Keep alive
        shell: pwsh
        run: |
          $env:Path = "$env:PLT_DIR;$env:Path"
          Write-Host "Serving adb over frp at $env:FRP_SERVER`:$env:FRP_REMOTE_PORT (job timeout 330m)"
          while ($true) {
            Start-Sleep -Seconds 300
            $t = (Test-NetConnection 127.0.0.1 -Port 5555 -WarningAction SilentlyContinue).TcpTestSucceeded
            $d = (adb devices | Out-String).Trim() -replace "`r", ''
            Write-Host "[heartbeat] local5555=$t; $d"
            if (-not $t) {
              Write-Host "::warning::nothing listening on 5555, re-establishing"
              adb connect "127.0.0.1:$env:MUMU_ADB_PORT_DETECTED"
              $det = [int]$env:MUMU_ADB_PORT_DETECTED
              if ($det -ne 5555) { netsh interface portproxy add v4tov4 listenaddress=127.0.0.1 listenport=5555 connectaddress=127.0.0.1 connectport=$det }
            }
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Get-Process frpc -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($env:MUMU_MANAGER) { & $env:MUMU_MANAGER control -v all shutdown 2>&1 }
