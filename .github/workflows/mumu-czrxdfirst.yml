name: MuMu + 超自然行动组 (com.pi.czrxdfirst)

# Reuses the MuMu ADB/frp workflow and pre-installs the game
# "超自然行动组" (package com.pi.czrxdfirst) into the emulator.
on:
  workflow_dispatch:

jobs:
  mumu-czrxdfirst:
    uses: ./.github/workflows/mumu-adb.yml
    with:
      # Direct APK (应用宝 CDN). Version-pinned; if it 404s the base
      # workflow falls back to scraping the latest link from sj.qq.com.
      preinstall_apk_url: 'https://imtt2.dd.qq.com/sjy.00008/sjy.00004/16891/apk/7542B962129EB1691ED44214B1BB4996.apk?fsname=com.pi.czrxdfirst_1.32.21.001.apk'
      preinstall_package: 'com.pi.czrxdfirst'
      preinstall_name: '超自然行动组'
