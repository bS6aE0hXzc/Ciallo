name: Windows SSH Debug via frp

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SSH_USER: runneradmin
  SSH_PASS: P@ssw0rd!2024
  FRP_SERVER: 187372.xyz
  FRP_TOKEN: wobushijiahao
  FRP_REMOTE_PORT: 2222

jobs:
  frp-ssh-debug:
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: Enable OpenSSH Server on Windows Runner
        shell: pwsh
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 -ErrorAction SilentlyContinue | Out-Null
          Set-Service -Name sshd -StartupType Automatic
          Start-Service sshd -ErrorAction SilentlyContinue
          # password login for the built-in runner admin
          Set-LocalUser -Name $env:SSH_USER -Password (ConvertTo-SecureString $env:SSH_PASS -AsPlainText -Force)
          # optional nicety: pwsh as default shell
          $pwsh = (Get-Command pwsh).Source
          reg add "HKLM\SOFTWARE\OpenSSH" /v DefaultShell /d "$pwsh" /f | Out-Null
          if (-not (Get-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -DisplayName 'OpenSSH Server (sshd)' -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22 | Out-Null
          }
          Get-Service sshd
          whoami

      - name: Download frp
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest https://github.com/fatedier/frp/releases/download/v0.61.1/frp_0.61.1_windows_amd64.zip -OutFile frp.zip
          Expand-Archive frp.zip -DestinationPath .
          $frpDir = (Get-ChildItem -Directory -Filter "frp_0.61.1_windows_amd64" | Select-Object -First 1).FullName
          "FRP_DIR=$frpDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Start frpc & Keep Alive
        shell: pwsh
        run: |
          Set-Location $env:FRP_DIR
          $log = "$env:FRP_DIR\frpc.log"
          $err = "$env:FRP_DIR\frpc.err.log"
          $args = @(
            'tcp',
            "--server_addr=$env:FRP_SERVER",
            '--server_port=7000',
            "--token=$env:FRP_TOKEN",
            '--proxy_name=ssh2222',
            '--local_ip=127.0.0.1',
            '--local_port=22',
            "--remote_port=$env:FRP_REMOTE_PORT"
          )
          Write-Host "Launching: .\frpc.exe $($args -join ' ')"
          $p = Start-Process -FilePath '.\frpc.exe' -ArgumentList $args -PassThru -WindowStyle Hidden -RedirectStandardOutput $log -RedirectStandardError $err
          Start-Sleep -Seconds 8
          Get-Content $log -ErrorAction SilentlyContinue | Write-Host
          Get-Content $err -ErrorAction SilentlyContinue | Write-Host
          if ($p.HasExited) { throw "frpc exited immediately with code $($p.ExitCode)" }

          Write-Host "============================================"
          Write-Host "  Windows SSH Debug Connection (frp)"
          Write-Host "============================================"
          Write-Host "Server   : $env:FRP_SERVER`:$env:FRP_REMOTE_PORT"
          Write-Host "Username : $env:SSH_USER"
          Write-Host "Password : $env:SSH_PASS"
          Write-Host "Connect  : ssh $env:SSH_USER@$env:FRP_SERVER -p $env:FRP_REMOTE_PORT"
          Write-Host "============================================"
          Write-Host "Debug helpers once logged in:"
          Write-Host "  & 'C:\Program Files\Netease\*\shell\MuMuManager.exe' info -v 0"
          Write-Host "  adb connect 127.0.0.1:5555 ; adb shell id"
          Write-Host "frpc is running. Keeping workflow alive..."

          while (-not $p.HasExited) { Start-Sleep -Seconds 300 }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Get-Process frpc -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Service sshd -ErrorAction SilentlyContinue
