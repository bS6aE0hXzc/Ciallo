name: Windows MuMu Player ADB via frp

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      preinstall_apk_url:
        description: 'Direct APK download URL to pre-install into the emulator (optional)'
        required: false
        default: ''
        type: string
      preinstall_package:
        description: 'Expected package name, used to verify the install (optional)'
        required: false
        default: ''
        type: string
      preinstall_name:
        description: 'Human-readable game/app name for log output (optional)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FRP_SERVER: 187372.xyz
  FRP_TOKEN: wobushijiahao
  FRP_REMOTE_PORT: 5555

jobs:
  mumu-adb-frp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout (for helper scripts)
        uses: actions/checkout@v4

      # --------------------------------------------------------------------
      # 1) Install MuMuPlayer Global (international), fully automated.
      #    The download is UI/visibility-gated and flaky on CI, so the real
      #    install runs inside an INTERACTIVE scheduled task that survives the
      #    click, shows the window, clicks "Install now", and waits for the
      #    registry key + MuMuManager.exe. This step just launches that task
      #    and polls for C:\mumu\install_done.txt.
      # --------------------------------------------------------------------
      - name: Install MuMuPlayer (automated, persistent)
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\mumu_install.ps1'
          if (-not (Test-Path $script)) { throw "install script missing: $script" }
          Remove-Item C:\mumu\install_done.txt -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force C:\mumu | Out-Null

          $a = New-ScheduledTaskAction -Execute 'powershell.exe' `
               -Argument "-STA -NoProfile -File `"$script`""
          $p = New-ScheduledTaskPrincipal -UserId 'runneradmin' -LogonType Interactive -RunLevel Highest
          Register-ScheduledTask -TaskName 'MumuInstall' -Action $a -Principal $p -Force | Out-Null
          Start-ScheduledTask -TaskName 'MumuInstall'
          Write-Host "MumuInstall scheduled task started"

          $deadline = (Get-Date).AddMinutes(300)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 30
            if (Test-Path C:\mumu\install_done.txt) { Write-Host "== install_done.txt present =="; break }
            $t = Get-ScheduledTask -TaskName 'MumuInstall' -ErrorAction SilentlyContinue
            if ($t -and $t.State -ne 'Running') {
              Write-Host "!! MumuInstall task ended (state=$($t.State)) without done flag"
              break
            }
            Write-Host "[poll] still installing..."
          }
          if (-not (Test-Path C:\mumu\install_done.txt)) {
            Write-Host "::error::MuMuPlayer did not finish installing in time"
            Get-Content C:\mumu\install.log -ErrorAction SilentlyContinue | Select-Object -Last 40 | Write-Host
            throw "MuMuPlayer install did not complete"
          }
          Write-Host "============================================"
          Write-Host " MuMuPlayer installed"
          Write-Host "============================================"

      # --------------------------------------------------------------------
      # 2) Enable root (patch instance configs) and launch the emulator.
      # --------------------------------------------------------------------
      - name: Enable root & launch emulator
        shell: pwsh
        run: |
          function Set-J($o,$n,$v){
            if ($o.PSObject.Properties[$n]) { $o.$n = $v } else { $o | Add-Member -NotePropertyName $n -NotePropertyValue $v }
          }
          $loc = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
                  Where-Object { $_.DisplayName -match '^MuMuPlayer' -and $_.InstallLocation } |
                  Select-Object -First 1).InstallLocation
          if (-not $loc) { throw "MuMuPlayer install location not found in registry" }
          $loc = $loc.Trim('"')
          Write-Host "Install location: $loc"
          $mm = Join-Path $loc 'nx_main\MuMuManager.exe'
          if (-not (Test-Path $mm)) { throw "MuMuManager.exe not found at $mm" }
          "MUMU_MANAGER=$mm"   | Out-File -FilePath $env:GITHUB_ENV -Append
          "MUMU_LOCATION=$loc" | Out-File -FilePath $env:GITHUB_ENV -Append

          # locate instance config dir(s)
          $cfgs = @(Get-ChildItem "$loc\vms" -Recurse -Depth 3 -Filter 'customer_config.json' -ErrorAction SilentlyContinue) +
                  (Get-ChildItem "$loc\nx_device" -Recurse -Depth 5 -Filter 'customer_config.json' -ErrorAction SilentlyContinue)
          $cfgs = $cfgs | Select-Object -Unique -ExpandProperty FullName
          foreach ($cf in $cfgs) {
            try {
              Write-Host "patching $cf"
              $j = Get-Content $cf -Raw -Encoding UTF8 | ConvertFrom-Json
              if (-not $j.setting) { Set-J $j 'setting' ([pscustomobject]@{}) }
              if (-not $j.setting.other_setting) { Set-J $j.setting 'other_setting' ([pscustomobject]@{}) }
              Set-J $j.setting.other_setting 'root_mode' '1'
              if (-not $j.setting.disk_share) { Set-J $j.setting 'disk_share' ([pscustomobject]@{}) }
              if (-not $j.setting.disk_share.mode) { Set-J $j.setting.disk_share 'mode' ([pscustomobject]@{}) }
              Set-J $j.setting.disk_share.mode 'choose' 'disk_share.mode.writable'
              $j | ConvertTo-Json -Depth 64 | Set-Content $cf -Encoding UTF8

              $vf = Join-Path (Split-Path $cf) 'vm_config.json'
              if (Test-Path $vf) {
                $v = Get-Content $vf -Raw -Encoding UTF8 | ConvertFrom-Json
                if ($v.system_vdi -and $v.system_vdi.PSObject.Properties['sharable']) { $v.system_vdi.sharable = 'Writable' }
                elseif ($v.vm -and $v.vm.system_vdi -and $v.vm.system_vdi.PSObject.Properties['sharable']) { $v.vm.system_vdi.sharable = 'Writable' }
                else { if (-not $v.system_vdi) { Set-J $v 'system_vdi' ([pscustomobject]@{}) }; Set-J $v.system_vdi 'sharable' 'Writable' }
                $v | ConvertTo-Json -Depth 64 | Set-Content $vf -Encoding UTF8
              }
            } catch { Write-Host "::warning::patch failed for ${cf}: $_" }
          }
          Write-Host "root_mode patched"

          # launch instance 0
          Write-Host "launching emulator instance 0..."
          & $mm control -v 0 launch 2>&1 | Write-Host
          $deadline = (Get-Date).AddMinutes(8)
          $started = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
            $probe = (& $mm info -v 0 2>&1 | Out-String)
            $started = ($probe -match '"is_process_started"\s*:\s*true')
            Write-Host ("[launch] process_started=$started")
            if ($started) { break }
          }
          if (-not $started) { throw "emulator instance 0 did not start" }
          Write-Host "emulator started"

      # --------------------------------------------------------------------
      # 3) Discover the real adb port, expose adbd on 127.0.0.1:5555, warm up root.
      #    Prefer MuMu's bundled adb; fall back to downloaded platform-tools.
      # --------------------------------------------------------------------
      - name: Discover ADB port & expose adbd on 5555
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $loc = $env:MUMU_LOCATION
          $mm  = $env:MUMU_MANAGER
          $bundled = Join-Path $loc 'nx_main\adb.exe'
          $adt = 'C:\mumu\platform-tools'
          if (-not (Test-Path $bundled)) {
            try {
              Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile C:\mumu\plt.zip -TimeoutSec 120
              Expand-Archive C:\mumu\plt.zip -DestinationPath C:\mumu -Force
            } catch { Write-Host "::warning::platform-tools download failed, relying on bundled adb" }
          }
          if (Test-Path $bundled) { $adb = $bundled }
          elseif (Test-Path (Join-Path $adt 'adb.exe')) { $adb = Join-Path $adt 'adb.exe' }
          else { throw "no adb available" }
          $env:Path = ((Split-Path $adb) + ';' + $env:Path)
          "ADB=$adb" | Out-File -FilePath $env:GITHUB_ENV -Append
          adb version

          # Wait until Android (not just the emulator process) has actually
          # booted. is_process_started becomes true almost immediately, but
          # adbd only starts listening after Android is up -- otherwise the
          # probe below would just spin for the whole window.
          Write-Host "waiting for Android to boot on instance 0..."
          $aboot = (Get-Date).AddMinutes(6)
          while ((Get-Date) -lt $aboot) {
            Start-Sleep -Seconds 10
            $info = (& $mm info -v 0 2>&1 | Out-String)
            if ($info -match '"is_android_started"\s*:\s*true') { Write-Host "[boot] android_started=true"; break }
            Write-Host "[boot] android not started yet..."
          }

          $candidates = @('7555','7556','5555','5556','7557','7655','7656','7558','7657')
          $real = $null
          $deadline = (Get-Date).AddMinutes(10)
          $attempt = 0
          while ((Get-Date) -lt $deadline) {
            $attempt++
            Start-Sleep -Seconds 10
            adb start-server 2>$null | Out-Null
            foreach ($p in $candidates) {
              $ep = "127.0.0.1:$p"
              adb connect $ep 2>$null | Out-Null
              $dev = (adb devices | Out-String)
              if ($dev | Select-String "$ep\s+device") { $real = $ep; break }
              # device present but offline/unauthorized -> recover instead of spinning
              if ($dev | Select-String "$ep\s+(offline|unauthorized)") {
                Write-Host "[adb] $ep not ready (offline/unauthorized) - reconnecting"
                adb disconnect $ep 2>$null | Out-Null
                adb reconnect 2>$null | Out-Null
              }
            }
            if (-not $real) {
              $emu = (adb devices | Select-String 'emulator-5554\s+device')
              if ($emu) { $real = 'emulator-5554' }
            }
            if ($real) { break }
            # avoid log spam: only report every 5th attempt (~every 2.5 min)
            if ($attempt % 5 -eq 0) {
              Write-Host "[adb] no device yet (attempt $attempt, elapsed $((Get-Date).Subtract($deadline.AddMinutes(-10)).TotalMinutes.ToString('0'))m)..."
            }
          }
          if (-not $real) { throw "adb device did not come up in time" }
          Write-Host "ADB device found at: $real"
          "MUMU_ADB=$real" | Out-File -FilePath $env:GITHUB_ENV -Append

          if ($real -ne '127.0.0.1:5555') {
            Write-Host "rebinding adbd to tcp:5555 (via $real)"
            adb -s $real tcpip 5555 2>&1 | Write-Host
            Start-Sleep -Seconds 6
            adb disconnect $real 2>$null | Out-Null
            for ($t = 0; $t -lt 12; $t++) {
              adb connect 127.0.0.1:5555 2>&1 | Write-Host
              if (adb devices | Select-String '127\.0\.0\.1:5555\s+device') { Write-Host "5555 up"; break }
              Start-Sleep -Seconds 5
            }
          }
          adb devices | Write-Host
          Write-Host "ADB is up on 127.0.0.1:5555"

      # --------------------------------------------------------------------
      # 5) REQUIRED FINAL VERIFICATION: adb root && adb shell id
      # --------------------------------------------------------------------
      - name: FINAL VERIFICATION (adb root && adb shell id)
        shell: pwsh
        run: |
          $adb = $env:ADB
          $env:Path = ((Split-Path $adb) + ';' + $env:Path)
          adb kill-server 2>$null
          adb start-server 2>$null
          Start-Sleep -Seconds 2
          $have = (adb devices | Select-String '127\.0\.0\.1:5555\s+device')
          if (-not $have) {
            if ($env:MUMU_ADB -and $env:MUMU_ADB -ne '127.0.0.1:5555') {
              Write-Host "5555 missing, rebinding from $env:MUMU_ADB"
              adb -s $env:MUMU_ADB tcpip 5555 2>&1 | Write-Host
              Start-Sleep -Seconds 6
            }
            for ($t = 0; $t -lt 12; $t++) {
              adb connect 127.0.0.1:5555 2>&1 | Write-Host
              if (adb devices | Select-String '127\.0\.0\.1:5555\s+device') { break }
              Start-Sleep -Seconds 5
            }
          }
          $env:ANDROID_SERIAL = '127.0.0.1:5555'
          adb devices | Write-Host

          $final = ''
          foreach ($i in 1..6) {
            Write-Host "============================================================"
            Write-Host "  REQUIRED FINAL VERIFICATION: adb root && adb shell id"
            Write-Host "============================================================"
            $final = (adb root && adb shell id) 2>&1 | Out-String
            Write-Host $final.Trim()
            if ($final -match 'uid=0\(root\)') { break }
            Write-Host "attempt $i did not show uid=0(root); reconnecting and retrying..."
            adb kill-server 2>$null; adb start-server 2>$null
            adb connect 127.0.0.1:5555 | Out-Null
            Start-Sleep -Seconds 5
          }
          if ($final -notmatch 'uid=0\(root\)') { throw "FINAL VERIFICATION FAILED - no uid=0(root)" }
          Write-Host "============================================================"
          Write-Host "  VERIFIED: root (uid=0) + adb available on 5555"
          Write-Host "  external: adb connect $env:FRP_SERVER`:$env:FRP_REMOTE_PORT"
          Write-Host "============================================================"

      # --------------------------------------------------------------------
      # 5b) Optional pre-installed game/app APK (passed in when this workflow
      #     is reused via `uses:`). Skipped for a plain manual dispatch.
      # --------------------------------------------------------------------
      - name: Pre-install game/app APK (optional)
        if: ${{ inputs.preinstall_apk_url != '' }}
        shell: pwsh
        run: |
          $adb = $env:ADB
          $env:Path = ((Split-Path $adb) + ';' + $env:Path)
          $url  = '${{ inputs.preinstall_apk_url }}'
          $pkg  = '${{ inputs.preinstall_package }}'
          $name = '${{ inputs.preinstall_name }}'
          $apk  = 'C:\mumu\preinstall.apk'
          Write-Host "Pre-installing: $name ($pkg)"

          $ok = $false
          # 1) try the explicit URL
          try {
            Write-Host "downloading APK from provided URL..."
            Invoke-WebRequest $url -OutFile $apk -TimeoutSec 900 `
              -UserAgent 'Mozilla/5.0' -Headers @{ Referer = 'https://sj.qq.com/' }
            $ok = $true
          } catch { Write-Host "::warning::explicit URL failed: $_" }
          # 2) fallback: scrape the latest APK link from 应用宝 by package name
          if (-not $ok -and $pkg) {
            try {
              Write-Host "fallback: scraping latest APK for $pkg from sj.qq.com ..."
              $pg  = (Invoke-WebRequest "https://sj.qq.com/appdetail/$pkg" -UserAgent 'Mozilla/5.0').Content
              $m   = [regex]::Match($pg, 'https?://[^\s\"\x27>]+\.apk\?fsname=' + [regex]::Escape($pkg) + '_[^\s\"\x27>]+')
              if ($m.Success) {
                Invoke-WebRequest $m.Value -OutFile $apk -TimeoutSec 900 `
                  -UserAgent 'Mozilla/5.0' -Headers @{ Referer = 'https://sj.qq.com/' }
                $ok = $true
              }
            } catch { Write-Host "::warning::scrape fallback failed: $_" }
          }
          if (-not $ok) { throw "could not download game/app APK for $name" }

          Write-Host "APK size: $((Get-Item $apk).Length) bytes"
          Write-Host "installing via adb ..."
          & $adb -s 127.0.0.1:5555 install -r $apk 2>&1 | Write-Host
          $inst = (& $adb -s 127.0.0.1:5555 shell pm list packages 2>$null | Out-String)
          if ($pkg -and ($inst -notmatch [regex]::Escape($pkg))) {
            Write-Host "::warning::package $pkg NOT found after install; pm list packages:"
            Write-Host $inst
          } else {
            Write-Host "============================================"
            Write-Host "  GAME/APP INSTALLED: $name ($pkg)"
            Write-Host "============================================"
          }

      # --------------------------------------------------------------------
      # 4) Start frpc tunnel: 127.0.0.1:5555 -> 187372.xyz:5555
      # --------------------------------------------------------------------
      - name: Start frpc (port5555)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Set-Location C:\mumu
          if (-not (Test-Path C:\mumu\frpc.exe)) {
            Invoke-WebRequest https://github.com/fatedier/frp/releases/download/v0.61.1/frp_0.61.1_windows_amd64.zip -OutFile C:\mumu\frp.zip
            Expand-Archive C:\mumu\frp.zip -DestinationPath C:\mumu\frpdir -Force
            Copy-Item (Get-ChildItem C:\mumu\frpdir -Recurse -Filter frpc.exe | Select-Object -First 1 -ExpandProperty FullName) C:\mumu\frpc.exe -Force
          }
          Write-Host "Launching: .\frpc.exe tcp --server_addr=$env:FRP_SERVER --server_port=7000 --token=*** --proxy_name=port5555 --local_ip=127.0.0.1 --local_port=5555 --remote_port=$env:FRP_REMOTE_PORT"
          $p = Start-Process C:\mumu\frpc.exe -ArgumentList @(
            'tcp',
            "--server_addr=$env:FRP_SERVER",
            '--server_port=7000',
            "--token=$env:FRP_TOKEN",
            '--proxy_name=port5555',
            '--local_ip=127.0.0.1',
            '--local_port=5555',
            "--remote_port=$env:FRP_REMOTE_PORT"
          ) -PassThru -WindowStyle Hidden -RedirectStandardOutput C:\mumu\frpc.log -RedirectStandardError C:\mumu\frpc.err.log
          Start-Sleep -Seconds 10
          Get-Content C:\mumu\frpc.log     | Write-Host
          Get-Content C:\mumu\frpc.err.log | Write-Host
          if ($p.HasExited) {
            Write-Host "::warning::frpc exited immediately (code $($p.ExitCode))"
          } else {
            $flog = Get-Content C:\mumu\frpc.log -ErrorAction SilentlyContinue
            if ($flog | Select-String 'start proxy success') { Write-Host "frpc proxy 'port5555' started successfully" }
          }
          "FRPC_PID=$($p.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "============================================"
          Write-Host "  frp tunnel up: adb connect $env:FRP_SERVER`:$env:FRP_REMOTE_PORT"
          Write-Host "============================================"
      # --------------------------------------------------------------------
      # 6) Keep alive (frp tunnel + emulator stay up for the job window)
      # --------------------------------------------------------------------
      - name: Keep alive
        shell: pwsh
        run: |
          $adb = $env:ADB
          $env:Path = ((Split-Path $adb) + ';' + $env:Path)
          $cli = @(
            'tcp',
            "--server_addr=$env:FRP_SERVER",
            '--server_port=7000',
            "--token=$env:FRP_TOKEN",
            '--proxy_name=port5555',
            '--local_ip=127.0.0.1',
            '--local_port=5555',
            "--remote_port=$env:FRP_REMOTE_PORT"
          )
          while ($true) {
            Start-Sleep -Seconds 300
            $frpc = (Get-Process frpc -ErrorAction SilentlyContinue | Measure-Object).Count
            if ($frpc -eq 0) {
              Write-Host "[heartbeat] frpc died - restarting"
              Start-Process C:\mumu\frpc.exe -ArgumentList $cli -WindowStyle Hidden `
                -RedirectStandardOutput C:\mumu\frpc.log -RedirectStandardError C:\mumu\frpc.err.log
            }
            Write-Host "[heartbeat] frpc_procs=$frpc"
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Get-Process frpc -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($env:MUMU_MANAGER) { & $env:MUMU_MANAGER control -v all shutdown 2>&1 | Out-Null }

      - name: Upload debug artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mumu-debug
          path: |
            C:\mumu\install.log
            C:\mumu\frpc.log
            C:\mumu\frpc.err.log
          if-no-files-found: ignore
