name: MuMu + 超自然行动组 (com.pi.czrxdfirst)

# Reuses the MuMu ADB/frp workflow and pre-installs the game
# "超自然行动组" (package com.pi.czrxdfirst) into the emulator.
on:
  workflow_dispatch:

jobs:
  mumu-czrxdfirst:
    uses: ./.github/workflows/mumu-adb.yml
    with:
      # Official game APK (chaoziran.com / 超自然行动组, package com.pi.czrxdfirst).
      # If this ever 404s, the base workflow falls back to scraping the latest
      # link for the package from sj.qq.com.
      preinstall_apk_url: 'https://op-file.preternatural.cc/pntlpro/apk/czrxd_901_official_1.32.14.001_acesafe.apk'
      preinstall_package: 'com.pi.czrxdfirst'
      preinstall_name: '超自然行动组'
